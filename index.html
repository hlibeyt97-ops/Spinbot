<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;user-select:none}
body,html{width:100%;height:100%;background:#1a1a1a;overflow:hidden}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;background:#fff}
.screen.active{display:flex}
#loginScreen{background:#fff;justify-content:space-between;padding:24px 20px;max-width:480px;margin:0 auto;overflow-y:auto}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand-title{font-size:24px;font-weight:900;color:#d36a1b}
.auth-tabs{display:flex;background:#f2f2f7;border-radius:12px;padding:3px;margin-bottom:20px}
.tab-btn{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:bold;color:#666;border-radius:10px;cursor:pointer;border:none;background:transparent}
.tab-btn.active{background:#fff;color:#333;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.form-group{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.input-field{width:100%;height:48px;background:#f7f7f7;border:1px solid #e1e1e1;border-radius:12px;padding:0 14px;font-size:14px;outline:none}
.action-btn{width:100%;height:48px;background:linear-gradient(135deg,#f57c00,#e65100);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
.top-bar{height:48px;background:linear-gradient(to bottom,#e38234,#d36a1b);display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex-shrink:0}
.top-left,.top-right{display:flex;align-items:center;gap:5px}
.heart-badge{display:flex;align-items:center;gap:5px;color:#fff;font-weight:bold;font-size:13px;background:rgba(0,0,0,0.15);padding:3px 8px;border-radius:20px}
.heart-icon{width:22px;height:22px;background:#ff3b30;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;border:1px solid #fff}
.icon-btn{width:28px;height:28px;background:rgba(255,255,255,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,0.3)}
.bonus-timer-badge{background:rgba(0,0,0,0.2);color:#ffeb3b;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:8px}
.wood-table-area{height:55vh;position:relative;background:#d88935;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}

.avatar-frame{width:58px;height:58px;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 4px 10px rgba(0,0,0,0.4);position:relative}

.player-label{color:#fff;font-size:8px;font-weight:bold;margin-top:2px;text-shadow:0 1px 2px #000;max-width:65px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-count{position:absolute;top:1px;right:2px;background:#e53935;color:#fff;font-size:8px;font-weight:bold;padding:1px 4px;border-radius:6px}
.center-bottle-box{position:absolute;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer}
.bottle-hint-wrapper{position:absolute;top:-24px;pointer-events:none}
.bottle-hint-text{color:#fff;font-size:10px;font-weight:bold;text-shadow:0 1px 3px #000;white-space:nowrap}
.bottle-wrapper{transform-origin:center center;transition:transform 3.5s cubic-bezier(0.15,0.85,0.25,1);filter:drop-shadow(3px 8px 6px rgba(0,0,0,0.5))}
.vip-champagne-bottle{width:32px;height:100px}
.selection-overlay-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;z-index:40;width:230px;background:rgba(0,0,0,0.6);padding:10px;border-radius:16px}
.selection-title{color:#fff;font-size:14px;font-weight:bold;margin-bottom:6px}
.selection-cards-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.select-user-card{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#000}
.select-user-card img{width:100%;height:100%;object-fit:cover}
.timer-number{color:#fff;font-size:20px;font-weight:900}
.selection-buttons-row{display:flex;gap:8px;width:100%}
.btn-vazgec{flex:1;background:#e53935;color:#fff;border:none;padding:7px 0;border-radius:8px;font-weight:bold;font-size:11px;cursor:pointer}
.btn-op{flex:1;background:#7cb342;color:#fff;border:none;padding:7px 0;border-radius:8px;font-weight:bold;font-size:11px;cursor:pointer}
.gift-panel-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:50;display:none;flex-direction:column;justify-content:flex-end}
.gift-panel-content{background:#fff;border-top-left-radius:20px;border-top-right-radius:20px;padding:12px 14px;max-height:48vh;display:flex;flex-direction:column}
.gift-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:bold;color:#444}
.gift-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;overflow-y:auto;padding-bottom:10px}
.gift-item{display:flex;flex-direction:column;align-items:center;background:#fdfdfd;border-radius:10px;padding:5px;cursor:pointer;border:1px solid #f0f0f0}
.gift-price{font-size:10px;font-weight:bold;color:#e65100}
.bottom-control-panel{flex:1;background:#fdfdfd;display:flex;flex-direction:column;overflow:hidden}
.chat-messages-container{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.chat-msg{font-size:11px}
.chat-msg .sender-name{font-weight:bold;color:#0288d1}
.chat-input-bar{height:40px;background:#fff;display:flex;align-items:center;padding:0 10px;gap:6px;border-top:1px solid #eee}
.chat-input{flex:1;border:none;padding:6px;color:#333;font-size:12px;outline:none}
.send-btn{width:28px;height:28px;background:#f57c00;border:none;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.modal-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:center;justify-content:center}
.modal-card{width:88%;max-width:340px;background:#fff;border-radius:20px;padding:14px;position:relative}
.close-btn{position:absolute;top:-8px;right:-8px;width:28px;height:28px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
</style>
</head>
